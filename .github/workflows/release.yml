name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Run tests
      run: go test ./...

    - name: Build release binaries
      run: |
        mkdir -p build/release
        GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o build/release/sesh-darwin-amd64 ./cmd/sesh
        GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o build/release/sesh-darwin-arm64 ./cmd/sesh
        GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o build/release/sesh-linux-amd64 ./cmd/sesh
        GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o build/release/sesh-linux-arm64 ./cmd/sesh
        ls -lh build/release/

    - name: Create checksums
      run: |
        cd build/release
        sha256sum sesh-* > checksums.txt
        cat checksums.txt

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/release/sesh-darwin-amd64
          build/release/sesh-darwin-arm64
          build/release/sesh-linux-amd64
          build/release/sesh-linux-arm64
          build/release/checksums.txt
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}